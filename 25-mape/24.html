<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spēles skaņas</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: skaņas bloku izskats */
.skana {
  background-color: #7c4545;
  border: 2px solid #5f2222;
  padding: 16px;
  margin: 16px 0;
  box-sizing: border-box;
}
</style>
</head>
<body>
<h1>Spēles skaņas</h1>
<p>Kad tu dzirdi šo skaņu, tad spied pogu ātri!</p>
<div class="skana">
  <h2>Vai tu esi gejs? </h2>
  <p>Šo skaņu dzirdēsi, kad dabūsi pareizi</p>
  <audio controls src="klikskis (1).wav"></audio>
</div>
<!-- ŠEIT OTRAIS SKAŅAS BLOKS -->
</body>
</html>
